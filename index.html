<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <link href="assets/css/style.css" rel="stylesheet">
        <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0'>
        <link rel="shortcut icon" href="assets/images/favicon.png" type="image/webp">
        <link rel="apple-touch-icon" sizes="180x180" href="images/favicon.png">
        <link rel="icon" href="assets/images/favicon.png" type="image/webp">
        <title>Linktree template</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    </head>
    <body>
        <!-- Snowfall Background Animation -->
        <section class="animated-background">
            <div id="stars1"></div>
            <div id="stars2"></div>
            <div id="stars3"></div>
        </section>
        <!-- End of Snowfall Background Animation -->

        <div class="min-h-full flex-h-center" id="background_div">
            <input type="hidden" value="https://bio.link" id="app-url">
                <input type="hidden" value="null" id="is-featured">
                    <canvas id="bg-canvas" class="background-overlay"></canvas>
                </input>
            </input>

            <div class="mt-48 page-full-wrap relative ">
                <input type="hidden" value="creator-page" id="page-type">
                <img class="display-image m-auto" data-src="assets/images/logo.png" src="assets/images/logo.png" alt="[Your photo alt]"/>
                <h2 class="page-title page-text-color page-text-font mt-16 text-center">Χριστιανική Φοιτητική Δράση</h2>
                       
                <div class="mt-24">
                    <div class="page-item-wrap relative">
                        <div class="page-item flex-both-center absolute"></div>
                        <a target="_blank" class="page-item-each py-10 flex-both-center" style="background-color: #043b0a; color: white;" href="https://open.spotify.com/show/1wZhzBug1KddVr4WzmWpBI?si=d6a672189bf74823">
                            <img class="link-each-image" data-src="assets/images/spotify.png" src="assets/images/spotify.png" alt="Spotify"/>
                            <span class="item-title text-center">Spotify</span>
                        </a>
                    </div>                       
                    <div class="page-item-wrap relative">
                        <div class="page-item flex-both-center absolute"></div>
                        <a target="_blank" class="page-item-each py-10 flex-both-center" style="background-color: #c70d0d; color: white;" href="https://www.youtube.com/@xfdthess">
                            <img class="link-each-image" data-src="assets/images/youtube.png" src="assets/images/youtube.png" alt="YouTube"/>
                            <span class="item-title text-center">YouTube</span>
                        </a>
                    </div>
                    <div class="page-item-wrap relative">
                        <div class="page-item flex-both-center absolute"></div>
                        <a target="_blank" class="page-item-each py-10 flex-both-center" style="background-color: #c46812; color: white;" href="https://www.instagram.com/xfdthess/">
                            <img class="link-each-image" data-src="assets/images/instagram.png" src="assets/images/instagram.png" alt="Instagram"/>
                            <span class="item-title text-center">Instagram</span>
                        </a>
                    </div>
                    <div class="page-item-wrap relative">
                        <div class="page-item flex-both-center absolute"></div>
                        <a target="_blank" class="page-item-each py-10 flex-both-center" style="background-color: #1816b5; color: white;" href="https://www.facebook.com/xfdthess">
                            <img class="link-each-image" data-src="assets/images/facebook.png" src="assets/images/facebook.png" alt="Facebook"/>
                            <span class="item-title text-center">Facebook</span>
                        </a>
                    </div>               
                </div>                                                                                
            </div>
        </div>
    </body>

    <!--
    A different snowfall    
    <script  src="assets/js/snowfall.js"></script>
    -->
</html>
